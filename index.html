<html lang="en" class="h-full bg-slate-50">

      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }

            'anti-gravity-hover': '0 30px 65px -12px rgba(37, 99, 235, 0.16), 0 12px 30px -8px rgba(15, 23, 42, 0.06)',
            'anti-gravity-lg': '0 35px 80px -15px rgba(37, 99, 235, 0.14), 0 15px 35px -10px rgba(15, 23, 42, 0.06)',

        }
      }

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #f8fafc 50%, #eff6ff 100%);
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 80px !important; /* Permanent bottom padding for sticky footer */
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    .anti-gravity-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .anti-gravity-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 65px -12px rgba(37, 99, 235, 0.16), 0 12px 30px -8px rgba(15, 23, 42, 0.06);
    }

    .nav-item-lift {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-item-lift:hover {
      transform: translateX(5px);
    }

    /* Mobile Sticky Footer styles - Fully Closed & Prominent */
    .mobile-sticky-footer {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      transform: none !important;
      z-index: 9999 !important;
      background-color: rgba(255, 255, 255, 0.98) !important;
      backdrop-filter: blur(16px) !important;
      border-top: 1px solid #e2e8f0 !important;
      box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.08) !important;
    }

    .admin-sticky-footer {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      z-index: 9999 !important;
      background-color: #0f172a !important;
    }

    @keyframes shimmerGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes subtleFloatName {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .animated-student-name {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 25%, #7c3aed 50%, #0284c7 75%, #1d4ed8 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmerGradient 6s ease infinite, subtleFloatName 4s ease-in-out infinite;
      filter: drop-shadow(0 12px 28px rgba(37, 99, 235, 0.25));
      padding-bottom: 0.15em;
      margin-bottom: -0.15em;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

    function get12HourTimeString(date = new Date()) {
      let hours = date.getHours();
      let minutes = date.getMinutes();
      let seconds = date.getSeconds();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = hours < 10 ? '0' + hours : hours;
      const strMinutes = minutes < 10 ? '0' + minutes : minutes;
      const strSeconds = seconds < 10 ? '0' + seconds : seconds;
      return `${strHours}:${strMinutes}:${strSeconds} ${ampm}`;
    }

    function getShort12HourTimeString(date = new Date()) {
      let hours = date.getHours();
      let minutes = date.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = hours < 10 ? '0' + hours : hours;
      const strMinutes = minutes < 10 ? '0' + minutes : minutes;
      return `${strHours}:${strMinutes} ${ampm}`;

    function setupRealtimeSync() {
      if (!db || !fsCollection || !fsOnSnapshot || !fsDoc) return;

      // 1. Listen to announcements updates
      fsOnSnapshot(fsDoc(db, 'announcements', 'global'), (docSnap) => {
        const announcements = docSnap.exists() ? (docSnap.data().data || []) : [];

        // 2. Listen to users updates
        fsOnSnapshot(fsCollection(db, 'users'), (querySnapshot) => {
          const dbStudents = [];
          querySnapshot.forEach((doc) => {
            const docData = doc.data();
            dbStudents.push({
              id: doc.id,
              data: docData.data,
              last_updated: docData.last_updated
            });
          });

          handleIncomingSync(dbStudents, announcements);
        }, (error) => {
          console.error("Firestore users listener error:", error);
        });
      }, (error) => {
        console.error("Firestore announcements listener error:", error);
      });
    }

    function handleIncomingSync(dbStudents, announcements) {
      if (dbStudents.length > 0) {
        const students = dbStudents.map(s => s.data);
        const remoteStr = JSON.stringify({
          students,
          announcements
        });

        if (remoteStr !== lastFetchedStateStr) {
          // Optimistic merge: compare timestamps before overwriting local state
          dbStudents.forEach(row => {
            const dbStud = row.data;
            const localIndex = state.students.findIndex(s => s.id === dbStud.id);
            if (localIndex > -1) {
              const localStud = state.students[localIndex];
              const localTime = Number(localStud.lastUpdated) || 0;
              const dbTime = Number(row.last_updated) || 0;
              if (dbTime > localTime) {
                state.students[localIndex] = dbStud;
              }
            } else {
              state.students.push(dbStud);
            }
          });
          
          // Delete students that are not in database
          const dbIds = dbStudents.map(s => s.id);
          state.students = state.students.filter(s => dbIds.includes(s.id));

          // Force all user attendance rates to 0, rename class Geenesis to genesis, and empty transactions
          let needsRemoteUpdate = false;
          state.students.forEach(s => {
            let updated = false;
            
            // Re-calculate or default attendance rate
            s.attendanceRecords = s.attendanceRecords || {};
            const recordCount = Object.keys(s.attendanceRecords).length;
            if (recordCount === 0) {
              if (s.attendanceRate !== 0.0) {
                s.attendanceRate = 0.0;
                updated = true;
              }
            } else {
              const vals = Object.values(s.attendanceRecords);
              const presents = vals.reduce((acc, v) => {
                if (v === "Present") return acc + 1.0;
                if (v === "Half Day") return acc + 0.5;
                return acc;
              }, 0);
              const rate = parseFloat(((presents / recordCount) * 100).toFixed(1));
              if (s.attendanceRate !== rate) {
                s.attendanceRate = rate;
                updated = true;
              }
            }

            if (s.class && s.class.toLowerCase().includes('geenesis')) {
              s.class = s.class.replace(/geenesis/gi, 'genesis');
              updated = true;
            }
            if (s.transactions && s.transactions.length > 0) {
              s.transactions = [];
              updated = true;
            }
            if (s.id === "MSH-2026-0001" && (!s.exams || s.exams.length === 0)) {
              s.exams = [
                { id: "EXM-001", subject: "Mathematics", code: "MAT-301", score: 85, grade: "A", credits: 4, sem: "Sem 4" },
                { id: "EXM-002", subject: "Physics", code: "PHY-302", score: 78, grade: "B+", credits: 4, sem: "Sem 4" },

              ];
              updated = true;
            }
            if (updated) {
              s.lastUpdated = Date.now();
              needsRemoteUpdate = true;
            }
          });

          state.announcements = announcements;
          lastFetchedStateStr = remoteStr;
          isBackendActive = true;

      const pendingDues = Math.max(0, totalFeesAssigned - totalCredits + totalDebits);
      return { totalCredits, totalDebits, totalFeesAssigned, pendingDues };
    }

    function calculateLiveAverageAttendance() {
      let totalRecords = 0;
      let totalPresents = 0;
      (state.students || []).forEach(s => {
        if (s.attendanceRecords) {
          const vals = Object.values(s.attendanceRecords);
          vals.forEach(v => {
            if (v === "Present") {
              totalRecords++;
              totalPresents += 1.0;
            } else if (v === "Half Day") {
              totalRecords++;
              totalPresents += 0.5;
            } else if (v === "Absent") {
              totalRecords++;
            }
          });
        }
      });
      if (totalRecords === 0) return "0.0%";
      return ((totalPresents / totalRecords) * 100).toFixed(1) + "%";
    }

    function getSemesterRankHolders(sem) {
      const targetSem = sem || state.selectedSem || 'Sem 4';
      const studentScores = (state.students || []).map(st => {
        const semExams = (st.exams || []).filter(e => (e.sem || 'Sem 4') === targetSem);
        const totalScore = semExams.reduce((s, e) => s + (e.score || 0), 0);
        const maxScore = semExams.length * 100;
        const pct = maxScore > 0 ? (totalScore / maxScore) * 100 : 0;
        const grade = semExams.length > 0 ? getGradeFromScore(pct) : 'N/A';
        return {
          student: st,
          totalScore,
          maxScore,
          pct: parseFloat(pct.toFixed(1)),
          grade,
          examCount: semExams.length
        };
      }).filter(item => item.examCount > 0)
        .sort((a, b) => b.pct - a.pct || b.totalScore - a.totalScore);

      return studentScores.slice(0, 3);
    }

    const MONTH_MAP = {
      "August": "08", "September": "09", "October": "10", "November": "11", "December": "12",
      "January": "01", "February": "02", "March": "03", "April": "04", "May": "05", "June": "06", "July": "07"
    };

    function getDaysInMonthString(monthStr) {
      const parts = monthStr.split(' ');
      const month = parts[0];
      
      const dayCounts = {
        "August": 31, "September": 30, "October": 31, "November": 30, "December": 31,
        "January": 31, "February": 28, "March": 31, "April": 30, "May": 31, "June": 30, "July": 31
      };
      
      return dayCounts[month] || 30;
    }

    function toggleAttendanceStatus(studentId, dateKey) {
      const student = state.students.find(s => s.id === studentId);
      if (!student) return;
      
      student.attendanceRecords = student.attendanceRecords || {};
      const current = student.attendanceRecords[dateKey];
      
      if (!current) {
        student.attendanceRecords[dateKey] = "Present";
      } else if (current === "Present") {
        student.attendanceRecords[dateKey] = "Absent";
      } else if (current === "Absent") {
        student.attendanceRecords[dateKey] = "Half Day";
      } else if (current === "Half Day") {
        student.attendanceRecords[dateKey] = "Academic Leave";
      } else {
        delete student.attendanceRecords[dateKey];
      }
      
      // Recalculate attendanceRate
      const vals = Object.values(student.attendanceRecords);
      const recordCount = vals.length;
      if (recordCount === 0) {
        student.attendanceRate = 0.0;
      } else {
        const presents = vals.reduce((acc, v) => {
          if (v === "Present") return acc + 1.0;
          if (v === "Half Day") return acc + 0.5;
          return acc;
        }, 0);
        student.attendanceRate = parseFloat(((presents / recordCount) * 100).toFixed(1));
      }

      // Recalculate totalLeaveDays
      recalculateStudentLeaves(student);
      
      student.lastUpdated = Date.now();
      saveState();
      renderApp();
    }

    function syncLeaveDatesToAttendance(student) {
      if (!student || !student.leaves || !Array.isArray(student.leaves)) return;
      student.attendanceRecords = student.attendanceRecords || {};
      
      student.leaves.forEach(leave => {
        if (!leave.startDate || leave.status === "Rejected") return;
        
        const startParts = leave.startDate.split('-');
        const endParts = (leave.endDate || leave.startDate).split('-');
        if (startParts.length !== 3) return;
        
        const start = new Date(parseInt(startParts[0]), parseInt(startParts[1]) - 1, parseInt(startParts[2]));
        const end = new Date(parseInt(endParts[0]), parseInt(endParts[1]) - 1, parseInt(endParts[2]));
        
        let curr = new Date(start);
        while (curr <= end) {
          const y = curr.getFullYear();
          const m = String(curr.getMonth() + 1).padStart(2, '0');
          const d = String(curr.getDate()).padStart(2, '0');
          const dateKey = `${y}-${m}-${d}`;
          
          if (!student.attendanceRecords[dateKey] || student.attendanceRecords[dateKey] === "Academic Leave") {
            student.attendanceRecords[dateKey] = "Academic Leave";
          }
          
          curr.setDate(curr.getDate() + 1);
        }
      });
    }

    function generateAttendanceDaysGrid(student, filterMonth) {
      syncLeaveDatesToAttendance(student);
      const daysCount = getDaysInMonthString(filterMonth);
      const parts = filterMonth.split(' ');
      const mName = parts[0];
      const year = parts[1];
      const mIdx = MONTH_MAP[mName];
      
      // Calculate first day of month (0: Sun, 1: Mon, ..., 6: Sat)
      const firstDayDate = new Date(`${mName} 1, ${year}`);
      const firstDayOfWeek = firstDayDate.getDay();

      student.attendanceRecords = student.attendanceRecords || {};
      
      let html = '';

      // Render empty offset cells before Day 1
      for (let i = 0; i < firstDayOfWeek; i++) {
        html += `<div class="h-10 w-full rounded-xl bg-slate-50/50 border border-slate-100/50"></div>`;
      }

      for (let d = 1; d <= daysCount; d++) {
        const dStr = d < 10 ? `0${d}` : `${d}`;
        const dateKey = `${year}-${mIdx}-${dStr}`;
        const status = student.attendanceRecords[dateKey];
        
        let statusClass = "bg-white border-slate-200 hover:bg-slate-50 text-slate-700";
        if (status === "Present") {
          statusClass = "bg-emerald-500 hover:bg-emerald-600 text-white border-emerald-500 shadow-sm";
        } else if (status === "Absent") {
          statusClass = "bg-rose-500 hover:bg-rose-600 text-white border-rose-500 shadow-sm";
        } else if (status === "Half Day") {
          statusClass = "bg-amber-500 hover:bg-amber-600 text-white border-amber-500 shadow-sm";
        } else if (status === "Academic Leave") {
          statusClass = "bg-slate-900 hover:bg-black text-white border-slate-900 shadow-sm";
        }
        
        html += `
          <button
            onclick="toggleAttendanceStatus('${student.id}', '${dateKey}')"
            class="flex items-center justify-center rounded-xl border text-center transition-all hover:scale-105 active:scale-95 cursor-pointer h-10 w-full font-black text-sm ${statusClass}"
            title="${dateKey} - ${status || 'Upcoming Dates'}"
          >
            ${d}
          </button>
        `;
      }
      return html;
    }

    function generateStudentAttendanceDaysGrid(student, filterMonth) {
      const daysCount = getDaysInMonthString(filterMonth);
      const parts = filterMonth.split(' ');
      const mName = parts[0];
      const year = parts[1];
      const mIdx = MONTH_MAP[mName];
      
      student.attendanceRecords = student.attendanceRecords || {};
      
      let html = '';
      for (let d = 1; d <= daysCount; d++) {

        const dateKey = `${year}-${mIdx}-${dStr}`;
        const status = student.attendanceRecords[dateKey];
        
        let statusClass = "bg-white border-slate-200 text-slate-700";
        if (status === "Present") {

        } else if (status === "Absent") {

        }
        
        html += `

            class="flex items-center justify-center rounded-xl border text-center cursor-default h-10 w-full font-black text-sm ${statusClass}"
            title="${dateKey} - ${status || 'Upcoming Dates'}"

      }

    }

    function recalculateStudentLeaves(student) {
      student.leaves = student.leaves || [];
      const approvedDays = student.leaves
        .filter(l => l.status === "Approved")
        .reduce((acc, l) => acc + (Number(l.days) || 0), 0);
      
      student.attendanceRecords = student.attendanceRecords || {};
      const attendanceAbsences = Object.values(student.attendanceRecords)
        .reduce((acc, v) => {
          if (v === "Absent") return acc + 1.0;
          if (v === "Half Day") return acc + 0.5;
          // Academic Leave is NOT counted in student leaves taken
          return acc;
        }, 0);
        
      student.totalLeaveDays = approvedDays + attendanceAbsences;
    }

    function updateSubjectPreview(value) {
      const card      = document.getElementById('subjectPreviewCard');
      const prevScore = document.getElementById('prevScore');
      const prevGrade = document.getElementById('prevGrade');
      if (!card || !prevScore || !prevGrade) return;

      const score = parseInt(value);
      if (isNaN(score) || value === '') {
        card.classList.add('hidden');
        return;
      }

    function handleImageUpload(input, mode) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 300; // 300x300 pixels
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          // Center crop to 1:1 ratio
          const sourceSize = Math.min(img.width, img.height);
          const sourceX = (img.width - sourceSize) / 2;
          const sourceY = (img.height - sourceSize) / 2;

          ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

          document.getElementById(mode === 'new' ? 'newStudPhotoUrl' : 'editStudPhotoUrl').value = dataUrl;
          document.getElementById(mode === 'new' ? 'newStudPhotoRemove' : 'editStudPhotoRemove').classList.remove('hidden');
          document.getElementById(mode === 'new' ? 'newStudPhotoRemove' : 'editStudPhotoRemove').classList.add('block');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

          highlight: false,

    function deleteStudentLeave(studentId, leaveId) {
      const student = state.students.find(s => s.id === studentId);
      if (student) {
        if (!confirm("Are you sure you want to delete this leave application?")) return;
        
        const targetLeave = student.leaves ? student.leaves.find(l => l.id === leaveId) : null;
        if (targetLeave && targetLeave.startDate) {
          const startParts = targetLeave.startDate.split('-');
          const endParts = (targetLeave.endDate || targetLeave.startDate).split('-');
          if (startParts.length === 3) {
            const start = new Date(parseInt(startParts[0]), parseInt(startParts[1]) - 1, parseInt(startParts[2]));
            const end = new Date(parseInt(endParts[0]), parseInt(endParts[1]) - 1, parseInt(endParts[2]));
            let curr = new Date(start);
            while (curr <= end) {
              const y = curr.getFullYear();
              const m = String(curr.getMonth() + 1).padStart(2, '0');
              const d = String(curr.getDate()).padStart(2, '0');
              const dateKey = `${y}-${m}-${d}`;
              if (student.attendanceRecords && student.attendanceRecords[dateKey] === "Academic Leave") {
                delete student.attendanceRecords[dateKey];
              }
              curr.setDate(curr.getDate() + 1);
            }
          }
        }
        
        student.leaves = student.leaves.filter(l => l.id !== leaveId);
        syncLeaveDatesToAttendance(student);
        recalculateStudentLeaves(student);
        student.lastUpdated = Date.now();
        saveState();
        renderApp();
      }
    }

    function getGradeFromScore(score) {
      if (score >= 90) return "A+";
      if (score >= 80) return "A";
      if (score >= 70) return "B+";
      if (score >= 60) return "B";
      if (score >= 50) return "C+";
      if (score >= 40) return "C";
      if (score >= 30) return "D+";
      if (score >= 20) return "D";
      return "E";
    }

    function getPercentageFromScore(score) {
      if (score >= 90) return 95;
      if (score >= 80) return 85;
      if (score >= 70) return 75;
      if (score >= 60) return 65;
      if (score >= 50) return 55;
      if (score >= 40) return 45;
      if (score >= 30) return 35;
      if (score >= 20) return 25;
      return 15;
    }

    function calculateStudentCGPA(student) {
      if (!student.exams || student.exams.length === 0) return "0.00";
      let totalPoints = 0;
      let totalCredits = 0;
      
      student.exams.forEach(exam => {
        let gp = 0;
        const score = exam.score;
        if (score >= 95) gp = 4.0;
        else if (score >= 90) gp = 3.7;
        else if (score >= 85) gp = 3.3;
        else if (score >= 80) gp = 3.0;
        else if (score >= 75) gp = 2.7;
        else if (score >= 70) gp = 2.0;
        else if (score >= 60) gp = 1.0;
        else gp = 0.0;
        
        const credits = Number(exam.credits) || 3;
        totalPoints += gp * credits;
        totalCredits += credits;
      });
      
      return totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : "0.00";
    }

      renderApp();
    }

    function handleAdminBroadcast(e) {
      e.preventDefault();
      const title = document.getElementById("adminAnnTitle").value;
      const urgency = document.getElementById("adminAnnUrgency").value;
      const categoryEl = document.getElementById("adminAnnCategory");
      const category = categoryEl ? categoryEl.value : "Admin Broadcast";
      const content = document.getElementById("adminAnnContent").value;
      state.announcements.unshift({
        id: Date.now(),
        title,
        content,
        urgency,
        category: category || "Admin Broadcast",
        date: `Just Now (${getShort12HourTimeString()})`,
        read: false
      });
      alert("Announcement broadcasted directly to student feed!");
      saveState();
      renderApp();
    }

    function openEditBroadcastModal(id) {
      state.editingBroadcastId = id;
      state.modals.editBroadcast = true;
      renderApp();
    }

    function handleEditBroadcastSubmit(e) {
      e.preventDefault();
      const item = state.announcements.find(a => a.id == state.editingBroadcastId);
      if (item) {
        item.title = document.getElementById("editAnnTitle").value;
        item.urgency = document.getElementById("editAnnUrgency").value;
        item.category = document.getElementById("editAnnCategory").value;
        item.content = document.getElementById("editAnnContent").value;
        saveState();
      }
      state.modals.editBroadcast = false;
      renderApp();
    }

    function deleteBroadcast(id) {
      if (confirm("Are you sure you want to delete this broadcast announcement?")) {
        state.announcements = state.announcements.filter(a => a.id != id);
        saveState();
        renderApp();
      }
    }

    function handleApplyLeave(e) {
      e.preventDefault();
      const student = getCurrentStudent();
      const startDate = document.getElementById("leaveStart").value;
      const endDate = document.getElementById("leaveEnd").value;
      const category = document.getElementById("leaveCategory").value;
      const reason = document.getElementById("leaveReason").value;
      student.leaves.unshift({
        id: `LV-${Math.floor(100 + Math.random() * 900)}`,
        startDate, endDate, category, reason,
        status: "Pending",
        appliedOn: new Date().toISOString().split('T')[0]
      });
      syncLeaveDatesToAttendance(student);
      student.lastUpdated = Date.now();
      toggleModal('leave', false);
      saveState();
      renderApp();
    }

    // Live 12-Hour Clock Interval Ticker
    setInterval(() => {
      const clockEl = document.getElementById("liveClockPill");
      if (clockEl) {
        clockEl.innerText = get12HourTimeString();
      }
    }, 1000);

    // Initialize App Render
    document.addEventListener("DOMContentLoaded", () => {
      loadState();
      renderApp();
      initFirebase();
    });
  </script>
</body>
</html>
