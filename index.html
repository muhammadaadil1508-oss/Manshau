    body {
      background: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #f8fafc 50%, #eff6ff 100%);
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 80px !important; /* Permanent bottom padding for sticky footer */
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    .anti-gravity-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .anti-gravity-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 65px -12px rgba(37, 99, 235, 0.16), 0 12px 30px -8px rgba(15, 23, 42, 0.06);
    }

    .nav-item-lift {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-item-lift:hover {
      transform: translateX(5px);
    }

    /* Mobile Sticky Footer styles */
    .mobile-sticky-footer {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      z-index: 9999 !important;
      background-color: #ffffff !important;
    }

    @keyframes shimmerGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes subtleFloatName {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .animated-student-name {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 25%, #7c3aed 50%, #0284c7 75%, #1d4ed8 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmerGradient 6s ease infinite, subtleFloatName 4s ease-in-out infinite;
      filter: drop-shadow(0 12px 28px rgba(37, 99, 235, 0.25));
      padding-bottom: 0.15em;
      margin-bottom: -0.15em;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

    function get12HourTimeString(date = new Date()) {
      let hours = date.getHours();
      let minutes = date.getMinutes();
      let seconds = date.getSeconds();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = hours < 10 ? '0' + hours : hours;
      const strMinutes = minutes < 10 ? '0' + minutes : minutes;
      const strSeconds = seconds < 10 ? '0' + seconds : seconds;
      return `${strHours}:${strMinutes}:${strSeconds} ${ampm}`;
    }

        const { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window.db = db; // Expose locally initialized Firestore globally!
        
        fsDoc = doc;
        fsSetDoc = setDoc;
        fsDeleteDoc = deleteDoc;
        fsCollection = collection;
        fsGetDocs = getDocs;
        fsOnSnapshot = onSnapshot;

        setupRealtimeSync();
      } catch (e) {
        console.error("Firebase init failed:", e);
      }
    }

      const active = document.activeElement;
      return active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");

    function saveStateLocalOnly() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          students: state.students,
          announcements: state.announcements,
          currentStudentId: state.currentStudentId,
          role: state.role,

        }));
      } catch(e) {}
    }

    function setupRealtimeSync() {
      if (!db || !fsCollection || !fsOnSnapshot || !fsDoc) return;

      // 1. Listen to announcements updates
      fsOnSnapshot(fsDoc(db, 'announcements', 'global'), (docSnap) => {
        const announcements = docSnap.exists() ? (docSnap.data().data || []) : [];

        // 2. Listen to users updates
        fsOnSnapshot(fsCollection(db, 'users'), (querySnapshot) => {
          const dbStudents = [];
          querySnapshot.forEach((doc) => {
            const docData = doc.data();
            dbStudents.push({
              id: doc.id,
              data: docData.data,
              last_updated: docData.last_updated
            });
          });

          handleIncomingSync(dbStudents, announcements);
        }, (error) => {
          console.error("Firestore users listener error:", error);
        });
      }, (error) => {
        console.error("Firestore announcements listener error:", error);
      });
    }

    function handleIncomingSync(dbStudents, announcements) {
      if (dbStudents.length > 0) {
        const students = dbStudents.map(s => s.data);
        const remoteStr = JSON.stringify({
          students,
          announcements
        });

        if (remoteStr !== lastFetchedStateStr) {
          // Optimistic merge: compare timestamps before overwriting local state
          dbStudents.forEach(row => {
            const dbStud = row.data;
            const localIndex = state.students.findIndex(s => s.id === dbStud.id);
            if (localIndex > -1) {
              const localStud = state.students[localIndex];
              const localTime = Number(localStud.lastUpdated) || 0;
              const dbTime = Number(row.last_updated) || 0;
              if (dbTime > localTime) {
                state.students[localIndex] = dbStud;
              }
            } else {
              state.students.push(dbStud);
            }
          });
          
          // Delete students that are not in database
          const dbIds = dbStudents.map(s => s.id);
          state.students = state.students.filter(s => dbIds.includes(s.id));

          // Force all user attendance rates to 0, rename class Geenesis to genesis, and empty transactions
          let needsRemoteUpdate = false;
          state.students.forEach(s => {
            let updated = false;
            if (s.attendanceRate !== 0) {
              s.attendanceRate = 0;
              updated = true;
            }
            if (s.class && s.class.toLowerCase().includes('geenesis')) {
              s.class = s.class.replace(/geenesis/gi, 'genesis');
              updated = true;
            }
            if (s.transactions && s.transactions.length > 0) {
              s.transactions = [];
              updated = true;
            }
            if (updated) {
              s.lastUpdated = Date.now();
              needsRemoteUpdate = true;
            }
          });

          state.announcements = announcements;
          lastFetchedStateStr = remoteStr;
          isBackendActive = true;
          saveStateLocalOnly();

          if (needsRemoteUpdate) {
            saveState(); // Propagate zeroed attendance back to Firestore
          }

          if (!isUserActivelyEditing()) {
            renderApp();
          } else {
            updateStatusBadgeUI();
          }
        } else if (!isBackendActive) {
          isBackendActive = true;
          updateStatusBadgeUI();
        }
      } else {
        // Empty DB: seed initial state
        isBackendActive = true;
        updateStatusBadgeUI();
        saveState();
      }
    }

    }

    async function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.students) {
            state.students = parsed.students.map(s => {
              let updated = false;
              if (s.attendanceRate !== 0) {
                s.attendanceRate = 0;
                updated = true;
              }
              if (s.class && s.class.toLowerCase().includes('geenesis')) {
                s.class = s.class.replace(/geenesis/gi, 'genesis');
                updated = true;
              }
              if (s.transactions && s.transactions.length > 0) {
                s.transactions = [];
                updated = true;
              }
              if (updated) {
                s.lastUpdated = Date.now();
              }
              return s;
            });
          }
          if (parsed.announcements) state.announcements = parsed.announcements;
          if (parsed.currentStudentId) state.currentStudentId = parsed.currentStudentId;
          if (parsed.role) state.role = parsed.role;
          if (parsed.isAuthenticated !== undefined) state.isAuthenticated = parsed.isAuthenticated;
          
          lastFetchedStateStr = JSON.stringify({
            students: state.students,
            announcements: state.announcements
          });
        } catch(e) {}
      }

      await syncWithServer();
    }

    async function saveState() {
      if (!db || !fsDoc || !fsSetDoc) return;

      const stateObj = {
        students: state.students,
        announcements: state.announcements
      };

      saveStateLocalOnly();
      lastFetchedStateStr = JSON.stringify(stateObj);

      try {
        // 1. Upsert all students to Firebase Firestore
        for (const student of state.students) {
          const incomingTime = Number(student.lastUpdated) || 0;
          await fsSetDoc(fsDoc(db, 'users', student.id), {
            data: student,
            last_updated: incomingTime
          });
        }

        // 2. Save announcements
        await fsSetDoc(fsDoc(db, 'announcements', 'global'), {
          data: state.announcements
        });

        if (!isBackendActive) {
          isBackendActive = true;
          updateStatusBadgeUI();
        }
      } catch(e) {
        if (isBackendActive) {
          isBackendActive = false;
          updateStatusBadgeUI();
        }
      }
    }

    function getCurrentStudent() {
      return state.students.find(s => s.id === state.currentStudentId) || state.students[0];
    }

    function getFinancials(studentObj) {
      const student = studentObj || getCurrentStudent();
      const totalCredits = student.transactions.filter(t => t.type === "Credit").reduce((sum, t) => sum + t.amount, 0);
      const totalDebits = student.transactions.filter(t => t.type === "Debit").reduce((sum, t) => sum + t.amount, 0);
      const totalFeesAssigned = 85000;
      const pendingDues = Math.max(0, totalFeesAssigned - totalCredits + totalDebits);
      return { totalCredits, totalDebits, totalFeesAssigned, pendingDues };
    }

    // --- STATE ACTION HANDLERS ---
    function setLoginRole(role) {
      state.loginRole = role;
      state.loginError = "";
      renderApp();
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const userEl = document.getElementById("loginUsername");
      const passEl = document.getElementById("loginPassword");
      const u = userEl ? userEl.value.trim() : "";
      const p = passEl ? passEl.value.trim() : "";

      if (state.loginRole === "student") {
        const found = state.students.find(s => s.username === u && s.password === p);
        if (found) {
          state.currentStudentId = found.id;
          state.isAuthenticated = true;
          state.role = "student";
          state.loginError = "";
          renderApp();
        } else {
          state.loginError = `Invalid Student Credentials! Check student usernames: ${state.students.map(s => s.username).join(', ')}`;
          renderApp();
        }
      } else if (state.loginRole === "admin") {
        if (u === state.adminCredentials.username && p === state.adminCredentials.password) {
          state.isAuthenticated = true;
          state.role = "admin";
          state.loginError = "";
          renderApp();
        } else {
          state.loginError = `Invalid Admin Credentials! Use admin / 123`;
          renderApp();
        }
      }
    }

      state.currentStudentId = studentId;

      renderApp();
    }

    }

    function toggleSpecificStudentStatus(studentId) {
      const student = state.students.find(s => s.id === studentId);

      }

    function toggleModal(modalName, isOpen) {
      state.modals[modalName] = isOpen;

    }

    function markRead(id) {
      const item = state.announcements.find(a => a.id === id);

    }

      state.announcements.forEach(a => a.read = true);

    async function deleteStudentUser(studentId) {
      if (state.students.length <= 1) {
        alert("Cannot delete the last remaining student user.");
        return;
      }
      const student = state.students.find(s => s.id === studentId);
      if (confirm(`Are you sure you want to delete student user "${student ? student.name : studentId}"?`)) {
        state.students = state.students.filter(s => s.id !== studentId);
        if (state.currentStudentId === studentId) {
          state.currentStudentId = state.students[0].id;
        }

        try {
          if (db && fsDoc && fsDeleteDoc) {
            await fsDeleteDoc(fsDoc(db, 'users', studentId));
          }
        } catch(e) {
          console.error("Failed to delete student from Firebase:", e);
        }

        alert("Student user deleted successfully!");
        renderApp();
      }
    }

      const name = document.getElementById("editStudName").value.trim();
      const school = document.getElementById("editStudSchool").value.trim();
      const className = document.getElementById("editStudClass").value.trim();
      const phone = document.getElementById("editStudPhone").value.trim();
      const age = parseInt(document.getElementById("editStudAge").value) || 0;
      const photoUrl = document.getElementById("editStudPhotoUrl").value;
      const username = document.getElementById("editStudUser").value.trim();
      const password = document.getElementById("editStudPass").value.trim();
      const smsPref = document.getElementById("editStudSmsPref").checked;
      const clockPref = document.getElementById("editStudClockPref").checked;

    function handleImageUpload(input, mode) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 300; // 300x300 pixels
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          // Center crop to 1:1 ratio
          const sourceSize = Math.min(img.width, img.height);
          const sourceX = (img.width - sourceSize) / 2;
          const sourceY = (img.height - sourceSize) / 2;

          ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

          document.getElementById(mode === 'new' ? 'newStudPhotoUrl' : 'editStudPhotoUrl').value = dataUrl;
          document.getElementById(mode === 'new' ? 'newStudPhotoRemove' : 'editStudPhotoRemove').classList.remove('hidden');
          document.getElementById(mode === 'new' ? 'newStudPhotoRemove' : 'editStudPhotoRemove').classList.add('block');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeUploadedImage(mode) {
      document.getElementById(mode === 'new' ? 'newStudPhoto' : 'editStudPhoto').value = "";
      document.getElementById(mode === 'new' ? 'newStudPhotoUrl' : 'editStudPhotoUrl').value = "";
      document.getElementById(mode === 'new' ? 'newStudPhotoRemove' : 'editStudPhotoRemove').classList.remove('block');
      document.getElementById(mode === 'new' ? 'newStudPhotoRemove' : 'editStudPhotoRemove').classList.add('hidden');
    }

    function getGradeFromScore(score) {
      if (score >= 95) return "A+";
      if (score >= 90) return "A";
      if (score >= 85) return "B+";
      if (score >= 80) return "B";
      if (score >= 75) return "C+";
      if (score >= 70) return "C";
      if (score >= 60) return "D";
      return "F";
    }

    function calculateStudentCGPA(student) {
      if (!student.exams || student.exams.length === 0) return "0.00";
      let totalPoints = 0;
      let totalCredits = 0;
      
      student.exams.forEach(exam => {
        let gp = 0;
        const score = exam.score;
        if (score >= 95) gp = 4.0;
        else if (score >= 90) gp = 3.7;
        else if (score >= 85) gp = 3.3;
        else if (score >= 80) gp = 3.0;
        else if (score >= 75) gp = 2.7;
        else if (score >= 70) gp = 2.0;
        else if (score >= 60) gp = 1.0;
        else gp = 0.0;
        
        const credits = Number(exam.credits) || 3;
        totalPoints += gp * credits;
        totalCredits += credits;
      });
      
      return totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : "0.00";
    }

    function editExamScoreForStudent(studentId, index) {
      const student = state.students.find(s => s.id === studentId);
      if (student && student.exams[index]) {
        const newScore = prompt(`Enter new score for ${student.name} (${student.exams[index].subject}):`, student.exams[index].score);
        if (newScore !== null && !isNaN(newScore)) {
          const score = parseInt(newScore);
          student.exams[index].score = score;
          student.exams[index].grade = getGradeFromScore(score);
          alert(`Score updated to ${score}% (Grade: ${student.exams[index].grade})!`);
          renderApp();
        }
      }
    }

    function promptAddCourseForStudent(studentId) {
      const student = state.students.find(s => s.id === studentId);
      if (!student) return;
      const subject = prompt("Enter Subject Name (e.g. Operating Systems):");
      if (!subject) return;
      const code = prompt("Enter Subject Code (e.g. CS-304):");
      if (!code) return;
      const scoreStr = prompt("Enter Score Percentage (0-100):", "90");
      if (scoreStr === null || isNaN(scoreStr)) return;
      const creditsStr = prompt("Enter Course Credits (e.g. 4):", "4");
      if (creditsStr === null || isNaN(creditsStr)) return;
      
      const score = parseInt(scoreStr);
      const credits = parseInt(creditsStr);
      const grade = getGradeFromScore(score);
      
      if (!student.exams) student.exams = [];
      student.exams.push({
        subject,
        code,
        score,
        grade,
        credits,
        sem: "Sem 5"
      });
      
      alert(`Successfully added ${subject} (Grade: ${grade}) to ${student.name}'s records!`);
      renderApp();
    }

    function deleteExamForStudent(studentId, index) {
      const student = state.students.find(s => s.id === studentId);
      if (student && student.exams[index]) {
        if (confirm(`Are you sure you want to delete ${student.exams[index].subject} from ${student.name}'s records?`)) {
          student.exams.splice(index, 1);
          alert("Subject deleted successfully!");
          renderApp();
        }

    }
