<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Savings Ledger & Money Tracker</title>
  
  <!-- Playful yet clean modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for cute icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #f0f4f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --brand-primary: #6366f1; /* Indigo */
      --brand-secondary: #4f46e5;
      --accent-green: #10b981; /* Deposit green */
      --accent-red: #f43f5e; /* Withdraw red */
      --accent-yellow: #f59e0b; /* Goal warning */
      --border-color: rgba(226, 232, 240, 0.8);
      --font-playful: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
      --shadow-soft: 0 10px 30px rgba(99, 102, 241, 0.05);
      --shadow-card: 0 20px 40px rgba(15, 23, 42, 0.08);
      --radius-large: 24px;
      --radius-medium: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at 10% 20%, rgba(243, 244, 246, 1) 0%, rgba(224, 231, 255, 0.4) 90%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 10px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-medium);
      border: 1px solid white;
      box-shadow: var(--shadow-soft);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-playful);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brand-primary);
    }

    .logo i {
      font-size: 1.8rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(5deg); }
    }

    .sync-status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e0e7ff;
      color: var(--brand-primary);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .sync-status.active {
      background: #d1fae5;
      color: #065f46;
      border-color: rgba(16, 185, 129, 0.2);
    }

    /* Main Grid */
    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Sidebar / Profile Management */
    .sidebar {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-large);
      border: 1px solid white;
      padding: 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-title {
      font-family: var(--font-playful);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--brand-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .add-kid-btn {
      background: var(--brand-primary);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .add-kid-btn:hover {
      background: var(--brand-secondary);
      transform: scale(1.1);
    }

    .kid-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 450px;
      padding-right: 4px;
    }

    .kid-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: var(--radius-medium);
      background: white;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .kid-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .kid-card.active {
      background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
      border-color: var(--brand-primary);
    }

    .kid-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .kid-info {
      flex: 1;
      min-width: 0;
    }

    .kid-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kid-age {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .kid-card-balance {
      font-family: var(--font-playful);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-green);
    }

    /* Main Dashboard View */
    .dashboard-view {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }

    /* Kid Banner */
    .kid-banner {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-large);
      border: 1px solid white;
      padding: 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .banner-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }

    .banner-details h2 {
      font-family: var(--font-playful);
      font-size: 1.8rem;
      color: var(--text-main);
    }

    .banner-details p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .banner-goal-pill {
      background: rgba(99, 102, 241, 0.1);
      color: var(--brand-primary);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-block;
      margin-top: 6px;
    }

    /* Piggy Bank Card & Action Buttons */
    .ledger-control-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .ledger-control-grid {
        grid-template-columns: 1fr;
      }
    }

    .piggy-bank-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border-radius: var(--radius-large);
      padding: 30px;
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
    }

    .piggy-bank-card::after {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      top: -30px;
      right: -30px;
    }

    .ledger-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      font-weight: 600;
    }

    .live-balance {
      font-family: var(--font-playful);
      font-size: 3.5rem;
      font-weight: 700;
      margin: 10px 0;
      text-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .goal-progress-container {
      margin-top: 15px;
    }

    .goal-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      opacity: 0.8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .goal-bar-bg {
      background: rgba(255, 255, 255, 0.15);
      height: 8px;
      border-radius: 4px;
      width: 100%;
      overflow: hidden;
    }

    .goal-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
      border-radius: 4px;
      width: 0%;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Buttons Container */
    .ledger-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .btn-action {
      border: none;
      padding: 20px 24px;
      border-radius: var(--radius-medium);
      font-family: var(--font-playful);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    .btn-action:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
    }

    .btn-action:active {
      transform: translateY(-1px);
    }

    .btn-deposit {
      background: linear-gradient(135deg, var(--accent-green) 0%, #059669 100%);
    }

    .btn-withdraw {
      background: linear-gradient(135deg, var(--accent-red) 0%, #e11d48 100%);
    }

    /* Table Container */
    .ledger-history-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-large);
      border: 1px solid white;
      padding: 24px;
      box-shadow: var(--shadow-card);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .card-title {
      font-family: var(--font-playful);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-responsive {
      overflow-x: auto;
      flex: 1;
      border-radius: var(--radius-medium);
      border: 1px solid var(--border-color);
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      background: #f8fafc;
      padding: 14px 16px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      font-weight: 500;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge-type {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-type.deposit {
      background: #ecfdf5;
      color: #047857;
    }

    .badge-type.withdrawal {
      background: #fff1f2;
      color: #be123c;
    }

    .amt-col {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .amt-col.deposit {
      color: var(--accent-green);
    }

    .amt-col.withdrawal {
      color: var(--accent-red);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      gap: 12px;
    }

    .empty-state i {
      font-size: 3rem;
      color: #cbd5e1;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      border-radius: var(--radius-large);
      padding: 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.7);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-family: var(--font-playful);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-input, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-medium);
      border: 1px solid #cbd5e1;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--text-main);
      background: #f8fafc;
      transition: all 0.2s;
    }

    .form-input:focus, select:focus {
      outline: none;
      border-color: var(--brand-primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .btn-submit {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: var(--radius-medium);
      font-family: var(--font-playful);
      font-weight: 700;
      font-size: 1.05rem;
      color: white;
      background: var(--brand-primary);
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--brand-secondary);
    }

    /* Profile Pic Upload Frame */
    .pic-upload-container {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      padding: 10px;
      border-radius: var(--radius-medium);
      border: 1px solid #cbd5e1;
    }

    .pic-upload-container input[type="file"] {
      display: none;
    }

    .upload-trigger-btn {
      background: #e2e8f0;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-trigger-btn:hover {
      background: #cbd5e1;
    }

    .upload-remove-btn {
      background: #fee2e2;
      color: var(--accent-red);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    .upload-remove-btn.active {
      display: inline-block;
    }

    .upload-preview {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* Scrollbar Styling */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-piggy-bank"></i>
      <span>Kids Pocket Ledger</span>
    </div>
    
    <div id="syncIndicator" class="sync-status">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <span>Local Ledger Mode</span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="app-container">
    
    <!-- SIDEBAR: KID LIST -->
    <aside class="sidebar">
      <div class="sidebar-title">
        <span>Kids Directory</span>
        <button onclick="openModal('addKid')" class="add-kid-btn" title="Add New Kid">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div id="kidList" class="kid-list scrollbar-none">
        <!-- Dynamic kid cards go here -->
      </div>
    </aside>

    <!-- DASHBOARD VIEW -->
    <main id="dashboardView" class="dashboard-view">
      <!-- Active kid profile details -->
      <div id="kidBanner" class="kid-banner">
        <!-- Dynamic banner details -->
      </div>

      <!-- Ledger bank controls -->
      <div class="ledger-control-grid">
        <div id="piggyBankCard" class="piggy-bank-card">
          <!-- Dynamic balance & goal metrics -->
        </div>

        <div class="ledger-actions">
          <button onclick="openModal('deposit')" class="btn-action btn-deposit">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Add Money (Deposit)</span>
          </button>
          
          <button onclick="openModal('withdraw')" class="btn-action btn-withdraw">
            <i class="fa-solid fa-circle-minus"></i>
            <span>Remove Money (Spend)</span>
          </button>
        </div>
      </div>

      <!-- Transaction History -->
      <div class="ledger-history-card">
        <div class="card-title">
          <i class="fa-solid fa-list-check" style="color: var(--brand-primary)"></i>
          <span>Savings Ledger Journal</span>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Date & Time</th>
                <th>Transaction Type</th>
                <th>Amount</th>
                <th>Reason / Notes</th>
                <th>Remaining Balance</th>
              </tr>
            </thead>
            <tbody id="ledgerTableBody">
              <!-- Dynamic rows -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= MODALS ================= -->

  <!-- ADD NEW KID MODAL -->
  <div id="addKidModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add New Kid</h3>
        <button onclick="closeModal('addKid')" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="addKidForm">
        <div class="form-group">
          <label for="kidNameInput">Kid Name</label>
          <input type="text" id="kidNameInput" required placeholder="e.g. Mishal T" class="form-input" />
        </div>

        <div class="form-group">
          <label for="kidAgeInput">Age</label>
          <input type="number" id="kidAgeInput" required min="1" max="18" placeholder="e.g. 12" class="form-input" />
        </div>

        <div class="form-group">
          <label for="kidGoalInput">Target Savings Goal (₹)</label>
          <input type="number" id="kidGoalInput" required min="0" value="5000" class="form-input" />
        </div>

        <div class="form-group">
          <label>Avatar / Profile Pic</label>
          <div class="pic-upload-container">
            <div id="avatarPreview" class="upload-preview">👶</div>
            <label for="kidPhotoFile" class="upload-trigger-btn">Upload Image</label>
            <input type="file" id="kidPhotoFile" accept="image/*" onchange="processProfilePicUpload(this)" />
            <input type="hidden" id="kidPhotoUrl" value="" />
            <button type="button" id="removePhotoBtn" onclick="clearProfilePicUpload()" class="upload-remove-btn">Remove</button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Add Kid Profile</button>
      </form>
    </div>
  </div>

  <!-- DEPOSIT MODAL -->
  <div id="depositModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Money (Deposit)</h3>
        <button onclick="closeModal('deposit')" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="depositForm">
        <div class="form-group">
          <label for="depositAmount">Amount (₹)</label>
          <input type="number" id="depositAmount" required min="1" placeholder="e.g. 500" class="form-input" />
        </div>

        <div class="form-group">
          <label for="depositNote">Reason / Note</label>
          <input type="text" id="depositNote" required placeholder="e.g. Weekly Savings Allowance" class="form-input" />
        </div>

        <button type="submit" class="btn-submit" style="background: var(--accent-green)">Complete Deposit</button>
      </form>
    </div>
  </div>

  <!-- WITHDRAW MODAL -->
  <div id="withdrawModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Remove Money (Spend)</h3>
        <button onclick="closeModal('withdraw')" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="withdrawForm">
        <div class="form-group">
          <label for="withdrawAmount">Amount (₹)</label>
          <input type="number" id="withdrawAmount" required min="1" placeholder="e.g. 200" class="form-input" />
        </div>

        <div class="form-group">
          <label for="withdrawReason">Reason / Category</label>
          <select id="withdrawReason" onchange="toggleCustomReason(this)">
            <option value="Bought Snacks">Bought Snacks</option>
            <option value="Bought Book">Bought Book</option>
            <option value="Bought Toy">Bought Toy</option>
            <option value="Pocket Expenses">Pocket Expenses</option>
            <option value="Savings Withdrawal">Savings Withdrawal</option>
            <option value="custom">Other / Custom Reason...</option>
          </select>
        </div>

        <div class="form-group" id="customReasonWrapper" style="display: none;">
          <label for="withdrawCustomNote">Custom Reason</label>
          <input type="text" id="withdrawCustomNote" placeholder="Explain spend..." class="form-input" />
        </div>

        <button type="submit" class="btn-submit" style="background: var(--accent-red)">Complete Withdrawal</button>
      </form>
    </div>
  </div>

  <!-- FIREBASE SYSTEM INTEGRATION MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Standard configurations matching existing project credentials
    const firebaseConfig = {
      apiKey: "AIzaSyAErR-u6nKGhele8Re9rrH7oKpZi98mBz0",
      authDomain: "manshau-408d3.firebaseapp.com",
      projectId: "manshau-408d3",
      storageBucket: "manshau-408d3.firebasestorage.app",
      messagingSenderId: "219428798097",
      appId: "1:219428798097:web:1f9aa67eb9817d9ae70930",
      measurementId: "G-9SZ61318JT"
    };

    const STORAGE_KEY = "kids_savings_ledger_state_v1";
    let db = null;
    let isFirebaseActive = false;

    // App state
    const state = {
      kids: [],
      activeKidId: null
    };

    // Initialize Firebase
    try {
      if (window.db) {
        db = window.db;
        isFirebaseActive = true;
      } else {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window.db = db;
        isFirebaseActive = true;
      }
    } catch (e) {
      console.warn("Firestore offline fallback active:", e);
    }

    // Load initial data
    function loadInitialState() {
      // 1. Check local storage first to populate UI instantly
      const local = localStorage.getItem(STORAGE_KEY);
      if (local) {
        try {
          const parsed = JSON.parse(local);
          state.kids = parsed.kids || [];
          state.activeKidId = parsed.activeKidId || null;
        } catch(e) {}
      }

      // If empty seed some default kids
      if (state.kids.length === 0) {
        state.kids = [
          {
            id: "KID-001",
            name: "Mishal T",
            age: 12,
            goal: 5000,
            photoUrl: "",
            balance: 1500,
            transactions: [
              { date: "2026-07-25 10:00:00", type: "Deposit", amount: 2000, note: "Initial Saving Deposit", balanceAfter: 2000 },
              { date: "2026-07-25 15:30:00", type: "Withdrawal", amount: 500, note: "Bought Book", balanceAfter: 1500 }
            ]
          },
          {
            id: "KID-002",
            name: "Swalih",
            age: 14,
            goal: 6000,
            photoUrl: "",
            balance: 0,
            transactions: []
          }
        ];
        state.activeKidId = "KID-001";
        saveState();
      }

      // 2. Setup Realtime Sync with Firestore if active
      if (isFirebaseActive && db) {
        const syncBadge = document.getElementById("syncIndicator");
        if (syncBadge) {
          syncBadge.classList.add("active");
          syncBadge.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><span>Firebase Synced</span>`;
        }

        const kidsCol = collection(db, "kids_ledger");
        onSnapshot(kidsCol, (snapshot) => {
          const kids = [];
          snapshot.forEach(doc => {
            kids.push(doc.data());
          });
          if (kids.length > 0) {
            state.kids = kids;
            // Ensure valid active kid ID
            if (!state.kids.some(k => k.id === state.activeKidId)) {
              state.activeKidId = state.kids[0].id;
            }
            saveStateLocalOnly();
            renderApp();
          }
        });
      } else {
        renderApp();
      }
    }

    // Save State
    function saveStateLocalOnly() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        kids: state.kids,
        activeKidId: state.activeKidId
      }));
    }

    async function saveState() {
      saveStateLocalOnly();
      if (isFirebaseActive && db) {
        try {
          const promises = state.kids.map(kid => {
            const docRef = doc(db, "kids_ledger", kid.id);
            return setDoc(docRef, kid);
          });
          await Promise.all(promises);
        } catch (e) {
          console.error("Failed uploading to Firebase:", e);
        }
      }
      renderApp();
    }

    // Dynamic Render
    function renderApp() {
      renderKidList();
      renderActiveKidDashboard();
    }

    function renderKidList() {
      const listContainer = document.getElementById("kidList");
      if (!listContainer) return;

      listContainer.innerHTML = state.kids.map(kid => {
        const isActive = kid.id === state.activeKidId;
        const avatarHtml = kid.photoUrl 
          ? `<img src="${kid.photoUrl}" class="kid-avatar" />`
          : `<div class="kid-avatar">👶</div>`;

        return `
          <div class="kid-card ${isActive ? 'active' : ''}" onclick="selectKid('${kid.id}')">
            ${avatarHtml}
            <div class="kid-info">
              <p class="kid-name">${kid.name}</p>
              <p class="kid-age">Age: ${kid.age} • Goal: ₹${kid.goal}</p>
            </div>
            <span class="kid-card-balance">₹${kid.balance}</span>
          </div>
        `;
      }).join('');
    }

    function renderActiveKidDashboard() {
      const activeKid = state.kids.find(k => k.id === state.activeKidId);
      const dashboard = document.getElementById("dashboardView");
      if (!dashboard) return;

      if (!activeKid) {
        dashboard.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-users-viewfinder"></i>
            <h3>No Kid Selected</h3>
            <p>Add a new kid profile or select one from the directory to start tracking.</p>
          </div>
        `;
        return;
      }

      // 1. Banner
      const bannerContainer = document.getElementById("kidBanner");
      if (bannerContainer) {
        const avatarHtml = activeKid.photoUrl
          ? `<img src="${activeKid.photoUrl}" class="banner-avatar" />`
          : `<div class="banner-avatar">👶</div>`;

        bannerContainer.innerHTML = `
          <div class="banner-left">
            ${avatarHtml}
            <div class="banner-details">
              <h2>${activeKid.name}</h2>
              <p>Savings Ledger Account • Age: ${activeKid.age} Years Old</p>
              <span class="banner-goal-pill">Savings Target: ₹${activeKid.goal}</span>
            </div>
          </div>
        `;
      }

      // 2. Piggy Bank Card (Balance & Goal)
      const piggyCard = document.getElementById("piggyBankCard");
      if (piggyCard) {
        const goalPercent = Math.min(Math.round((activeKid.balance / activeKid.goal) * 100), 100) || 0;
        piggyCard.innerHTML = `
          <div>
            <p class="ledger-label">Total Pocket Balance</p>
            <h1 class="live-balance">₹${activeKid.balance}</h1>
          </div>
          
          <div class="goal-progress-container">
            <div class="goal-text-row">
              <span>Goal Progress: ${goalPercent}%</span>
              <span>Goal: ₹${activeKid.goal}</span>
            </div>
            <div class="goal-bar-bg">
              <div class="goal-bar-fill" style="width: ${goalPercent}%"></div>
            </div>
          </div>
        `;
      }

      // 3. Table Rows
      const tableBody = document.getElementById("ledgerTableBody");
      if (tableBody) {
        if (!activeKid.transactions || activeKid.transactions.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="empty-state">
                  <i class="fa-solid fa-receipt"></i>
                  <p>No transactions registered for ${activeKid.name} yet.</p>
                </div>
              </td>
            </tr>
          `;
        } else {
          const sortedTxns = [...activeKid.transactions].reverse();
          tableBody.innerHTML = sortedTxns.map(t => {
            const isDeposit = t.type === "Deposit";
            const badgeClass = isDeposit ? "deposit" : "withdrawal";
            const typeText = isDeposit ? "Deposit" : "Spend";
            const typeIcon = isDeposit ? "fa-circle-chevron-up" : "fa-circle-chevron-down";
            const amtClass = isDeposit ? "deposit" : "withdrawal";
            const amtPrefix = isDeposit ? "+" : "-";

            return `
              <tr>
                <td>${t.date}</td>
                <td>
                  <span class="badge-type ${badgeClass}">
                    <i class="fa-solid ${typeIcon}"></i>
                    <span>${typeText}</span>
                  </span>
                </td>
                <td class="amt-col ${amtClass}">${amtPrefix} ₹${t.amount}</td>
                <td style="font-weight: 600;">${t.note}</td>
                <td class="amt-col" style="color: var(--text-main)">₹${t.balanceAfter}</td>
              </tr>
            `;
          }).join('');
        }
      }
    }

    // Modal helpers
    function openModal(modalName) {
      document.getElementById(`${modalName}Modal`).classList.add('open');
    }

    function closeModal(modalName) {
      document.getElementById(`${modalName}Modal`).classList.remove('open');
    }

    function selectKid(kidId) {
      state.activeKidId = kidId;
      saveStateLocalOnly();
      renderApp();
    }

    // Bind helpers globally
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.selectKid = selectKid;

    // Form Submissions
    document.getElementById("addKidForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("kidNameInput").value.trim();
      const age = parseInt(document.getElementById("kidAgeInput").value);
      const goal = parseInt(document.getElementById("kidGoalInput").value);
      const photoUrl = document.getElementById("kidPhotoUrl").value;

      const newKid = {
        id: `KID-${Date.now()}`,
        name, age, goal, photoUrl,
        balance: 0,
        transactions: []
      };

      state.kids.push(newKid);
      state.activeKidId = newKid.id;
      
      // Clear forms
      document.getElementById("addKidForm").reset();
      clearProfilePicUpload();

      closeModal('addKid');
      saveState();
    });

    document.getElementById("depositForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const amount = parseInt(document.getElementById("depositAmount").value);
      const note = document.getElementById("depositNote").value.trim();

      const activeKid = state.kids.find(k => k.id === state.activeKidId);
      if (activeKid) {
        const newBalance = activeKid.balance + amount;
        const now = new Date();
        const dateStr = now.getFullYear() + '-' + 
          String(now.getMonth() + 1).padStart(2, '0') + '-' + 
          String(now.getDate()).padStart(2, '0') + ' ' + 
          String(now.getHours()).padStart(2, '0') + ':' + 
          String(now.getMinutes()).padStart(2, '0') + ':' + 
          String(now.getSeconds()).padStart(2, '0');

        activeKid.balance = newBalance;
        activeKid.transactions.push({
          date: dateStr,
          type: "Deposit",
          amount,
          note,
          balanceAfter: newBalance
        });

        document.getElementById("depositForm").reset();
        closeModal('deposit');
        saveState();
      }
    });

    document.getElementById("withdrawForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const amount = parseInt(document.getElementById("withdrawAmount").value);
      
      const selectBox = document.getElementById("withdrawReason");
      let note = selectBox.value;
      if (note === "custom") {
        note = document.getElementById("withdrawCustomNote").value.trim() || "Savings Spend";
      }

      const activeKid = state.kids.find(k => k.id === state.activeKidId);
      if (activeKid) {
        if (activeKid.balance < amount) {
          alert(`Insufficient Balance! ${activeKid.name} only has ₹${activeKid.balance} saved.`);
          return;
        }

        const newBalance = activeKid.balance - amount;
        const now = new Date();
        const dateStr = now.getFullYear() + '-' + 
          String(now.getMonth() + 1).padStart(2, '0') + '-' + 
          String(now.getDate()).padStart(2, '0') + ' ' + 
          String(now.getHours()).padStart(2, '0') + ':' + 
          String(now.getMinutes()).padStart(2, '0') + ':' + 
          String(now.getSeconds()).padStart(2, '0');

        activeKid.balance = newBalance;
        activeKid.transactions.push({
          date: dateStr,
          type: "Withdrawal",
          amount,
          note,
          balanceAfter: newBalance
        });

        document.getElementById("withdrawForm").reset();
        document.getElementById("customReasonWrapper").style.display = "none";
        closeModal('withdraw');
        saveState();
      }
    });

    // Profile Pic crop function
    window.processProfilePicUpload = function(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 300; // 300x300 square crop
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          // Center crop algorithm
          const sourceSize = Math.min(img.width, img.height);
          const sourceX = (img.width - sourceSize) / 2;
          const sourceY = (img.height - sourceSize) / 2;

          ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

          document.getElementById("kidPhotoUrl").value = dataUrl;
          
          const preview = document.getElementById("avatarPreview");
          preview.innerHTML = `<img src="${dataUrl}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;" />`;
          
          document.getElementById("removePhotoBtn").classList.add("active");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.clearProfilePicUpload = function() {
      document.getElementById("kidPhotoFile").value = "";
      document.getElementById("kidPhotoUrl").value = "";
      document.getElementById("avatarPreview").innerHTML = "👶";
      document.getElementById("removePhotoBtn").classList.remove("active");
    };

    window.toggleCustomReason = function(selectBox) {
      const wrapper = document.getElementById("customReasonWrapper");
      if (selectBox.value === "custom") {
        wrapper.style.display = "block";
        document.getElementById("withdrawCustomNote").required = true;
      } else {
        wrapper.style.display = "none";
        document.getElementById("withdrawCustomNote").required = false;
      }
    };

    // Boot app
    loadInitialState();
  </script>
</body>
</html>
